<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task Manager - Multi-User SaaS</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #f4f7f6; }
    .card { background: #ffffff; padding: 25px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    input, button { width: 100%; padding: 12px; margin: 8px 0; font-size: 16px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background: #0056b3; }
    .secondary-btn { background: #6c757d; }
    .secondary-btn:hover { background: #5a6268; }
    ul { padding-left: 0; list-style: none; }
    li { display: flex; align-items: center; justify-content: space-between; background: #f9f9f9; padding: 10px 15px; margin: 8px 0; border-radius: 4px; border: 1px solid #eee; }
    .toggle-link { color: #007bff; cursor: pointer; text-decoration: underline; background: none; border: none; padding: 0; font-size: 14px; width: auto; display: inline; }
  </style>
</head>
<body>

  <h1 style="text-align: center; color: #333;">Task Manager SaaS</h1>

  <!-- LOGIN SECTION -->
  <div id="login-section" class="card">
    <h3>Log In to Your Account</h3>
    <input type="email" id="login-email" placeholder="Enter email..." required />
    <input type="password" id="login-password" placeholder="Enter password..." required />
    <button onclick="loginUser()">Log In</button>
    <p style="text-align: center; margin-top: 15px;">
      Don't have an account? <button class="toggle-link" onclick="showRegisterView()">Sign up here</button>
    </p>
  </div>

  <!-- REGISTER SECTION (Hidden by default) -->
  <div id="register-section" class="card" style="display: none;">
    <h3>Create New Account</h3>
    <input type="text" id="reg-username" placeholder="Enter username..." required />
    <input type="email" id="reg-email" placeholder="Enter email..." required />
    <input type="password" id="reg-password" placeholder="Enter password..." required />
    <button onclick="registerUser()">Sign Up</button>
    <p style="text-align: center; margin-top: 15px;">
      Already have an account? <button class="toggle-link" onclick="showLoginView()">Log in here</button>
    </p>
  </div>

  <!-- DASHBOARD SECTION (Hidden until logged in) -->
  <div id="dashboard-section" class="card" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px;">
      <div>
        <h3 style="margin: 0; color: #333;">Your Isolated Tasks</h3>
        <p id="user-welcome" style="margin: 5px 0 0 0; color: #666; font-size: 14px; font-weight: bold;"></p>
      </div>
      <button onclick="logoutUser()" class="secondary-btn" style="width: auto; padding: 8px 15px;">Log Out</button>
    </div>

    <!-- Add New Task Form -->
    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
      <input type="text" id="task-title" placeholder="Enter new task..." style="margin: 0;" />
      <button onclick="createTask()" style="width: 130px; margin: 0;">Add Task</button>
    </div>

    <!-- Task List -->
    <ul id="task-list">Loading tasks...</ul>
  </div>

  <script>
    // 1. Check token on initial page load
    const token = localStorage.getItem('authToken');
    if (token) {
      showDashboard();
      fetchTasks();
    }

    // 2. Register User Function
    async function registerUser() {
      const username = document.getElementById('reg-username').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;

      if (!username || !email || !password) {
        return alert('Please fill in all registration fields.');
      }

      try {
        const response = await fetch('http://localhost:4000/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });

        const result = await response.json();

        if (result.success) {
          alert('Registration successful! Please log in with your new account.');
          showLoginView();
        } else {
          alert('Registration failed: ' + (result.error || 'Unknown error'));
        }
      } catch (err) {
        console.error('Network error during registration:', err);
      }
    }

    // 3. Log In User Function (Storing Username too)
    async function loginUser() {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      try {
        const response = await fetch('http://localhost:4000/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const result = await response.json();

        if (result.success) {
          localStorage.setItem('authToken', result.token);
          // If your backend returns user info, store it. Otherwise fallback to email.
          localStorage.setItem('userEmail', email);
          
          alert('Logged in successfully!');
          showDashboard();
          fetchTasks();
        } else {
          alert('Login failed: ' + (result.error || 'Invalid credentials'));
        }
      } catch (err) {
        console.error('Network error during login:', err);
      }
    }

    // 4. Fetch User-Specific Tasks (Rendering Checkboxes & Delete Buttons)
    async function fetchTasks() {
      try {
        const currentToken = localStorage.getItem('authToken');
        const response = await fetch('http://localhost:4000/api/tasks', {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${currentToken}`
          }
        });

        const result = await response.json();
        const taskListEl = document.getElementById('task-list');
        taskListEl.innerHTML = '';

        if (result.success && Array.isArray(result.data)) {
          if (result.data.length === 0) {
            taskListEl.innerHTML = '<li style="justify-content: center; color: #777;">No tasks found. Create your first task above!</li>';
            return;
          }

          result.data.forEach(task => {
            const li = document.createElement('li');

            // Left side: Checkbox + Title
            const leftDiv = document.createElement('div');
            leftDiv.style.display = 'flex';
            leftDiv.style.alignItems = 'center';
            leftDiv.style.gap = '12px';

            const checkboxEl = document.createElement('input');
            checkboxEl.type = 'checkbox';
            checkboxEl.checked = task.completed;
            checkboxEl.style.width = '20px';
            checkboxEl.style.height = '20px';
            checkboxEl.style.cursor = 'pointer';
            checkboxEl.onchange = () => toggleTaskCompletion(task._id, checkboxEl.checked);

            const span = document.createElement('span');
            span.textContent = task.title;
            span.style.fontSize = '16px';
            if (task.completed) {
              span.style.textDecoration = 'line-through';
              span.style.color = '#888';
            }

            leftDiv.appendChild(checkboxEl);
            leftDiv.appendChild(span);

            // Right side: Delete Button
            const deleteBtn = document.createElement('button');
            deleteBtn.textContent = '🗑️ Delete';
            deleteBtn.style.width = 'auto';
            deleteBtn.style.padding = '6px 12px';
            deleteBtn.style.background = '#dc3545';
            deleteBtn.style.fontSize = '14px';
            deleteBtn.style.margin = '0';
            deleteBtn.onclick = () => deleteTask(task._id);

            li.appendChild(leftDiv);
            li.appendChild(deleteBtn);
            taskListEl.appendChild(li);
          });
        } else {
          console.error('Failed to load tasks:', result.error);
        }
      } catch (err) {
        console.error('Error fetching tasks:', err);
      }
    }

    // 5. Create Task Tied to User ID
    async function createTask() {
      const titleInput = document.getElementById('task-title');
      const title = titleInput.value.trim();
      if (!title) return alert('Task title cannot be empty');

      try {
        const currentToken = localStorage.getItem('authToken');
        const response = await fetch('http://localhost:4000/api/tasks', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${currentToken}`
          },
          body: JSON.stringify({ title })
        });

        const result = await response.json();

        if (result.success) {
          titleInput.value = '';
          fetchTasks();
        } else {
          alert('Failed to create task: ' + result.error);
        }
      } catch (err) {
        console.error('Error creating task:', err);
      }
    }

    // 6. Toggle Task Completion (PUT Request)
    async function toggleTaskCompletion(taskId, completed) {
      try {
        const currentToken = localStorage.getItem('authToken');
        await fetch(`http://localhost:4000/api/tasks/${taskId}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${currentToken}`
          },
          body: JSON.stringify({ completed })
        });
        fetchTasks();
      } catch (err) {
        console.error('Error updating task status:', err);
      }
    }

    // 7. Delete Task (DELETE Request)
    async function deleteTask(taskId) {
      try {
        const currentToken = localStorage.getItem('authToken');
        await fetch(`http://localhost:4000/api/tasks/${taskId}`, {
          method: 'DELETE',
          headers: {
            'Authorization': `Bearer ${currentToken}`
          }
        });
        fetchTasks();
      } catch (err) {
        console.error('Error deleting task:', err);
      }
    }

    // --- UI View Switching & Profile Helpers ---
    function showRegisterView() {
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('register-section').style.display = 'block';
    }

    function showLoginView() {
      document.getElementById('register-section').style.display = 'none';
      document.getElementById('login-section').style.display = 'block';
    }

    function showDashboard() {
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('register-section').style.display = 'none';
      document.getElementById('dashboard-section').style.display = 'block';
      
      // Display user profile info in header
      const userEmail = localStorage.getItem('userEmail') || 'Active User';
      document.getElementById('user-welcome').textContent = `Signed in as: ${userEmail}`;
    }

    function logoutUser() {
      localStorage.removeItem('authToken');
      localStorage.removeItem('userEmail');
      document.getElementById('dashboard-section').style.display = 'none';
      showLoginView();
    }
  </script>

</body>
</html>
